<!doctype html>
<html>
	<head lang="en">
		<title>Wardeck Stat</title>
		<meta charset="utf-8" />
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<!-- Two dropdowns only: Platform, then Metric for that platform (others hidden). -->
		<sdpi-item label="Platform">
			<sdpi-select id="platform" setting="platform" default="wigle">
				<option value="wigle">WiGLE</option>
				<option value="wdgwars">WDGWars</option>
				<option value="wardrift">Wardrift</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item id="metric-wigle" label="Metric" data-platform="wigle">
			<sdpi-select setting="wigleMetric" default="wifiAll">
				<option value="wifiAll">WiFi (all)</option>
				<option value="cell">Cell</option>
				<option value="rank">Rank</option>
				<option value="monthRank">Month rank</option>
				<option value="monthEvents">Month events</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item id="metric-wdgwars" label="Metric" data-platform="wdgwars" style="display: none">
			<sdpi-select setting="wdgwarsMetric" default="total">
				<option value="total">Total</option>
				<option value="wifi">WiFi</option>
				<option value="ble">BLE</option>
				<option value="aircraft">Aircraft</option>
				<option value="mesh">Mesh</option>
				<option value="badges">Badges</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item id="metric-wardrift" label="Metric" data-platform="wardrift" style="display: none">
			<sdpi-select setting="wardriftMetric" default="networks">
				<option value="networks">Networks</option>
				<option value="routes">Routes</option>
				<option value="threats">Threats</option>
				<option value="streak">Streak</option>
				<option value="level">Level</option>
				<option value="currency">Coin</option>
				<option value="expToNext">To next</option>
				<option value="name">Name</option>
				<option value="faction">Faction</option>
			</sdpi-select>
		</sdpi-item>

		<details open>
			<summary>API Credentials (global)</summary>

			<sdpi-item label="WiGLE API Name">
				<sdpi-textfield global setting="wigleApiName" placeholder="API Name"></sdpi-textfield>
			</sdpi-item>
			<sdpi-item label="WiGLE API Token">
				<sdpi-password global setting="wigleApiToken" placeholder="API Token"></sdpi-password>
			</sdpi-item>
			<sdpi-item label="">
				<sdpi-button id="test-wigle">Test WiGLE</sdpi-button>
			</sdpi-item>

			<sdpi-item label="WDGWars API Key">
				<sdpi-password global setting="wdgwarsApiKey" placeholder="X-API-Key"></sdpi-password>
			</sdpi-item>
			<sdpi-item label="">
				<sdpi-button id="test-wdgwars">Test WDGWars</sdpi-button>
			</sdpi-item>

			<sdpi-item label="Wardrift Username">
				<sdpi-textfield
					global
					setting="wardriftUsername"
					placeholder="username"
				></sdpi-textfield>
			</sdpi-item>
			<sdpi-item label="Wardrift Password">
				<sdpi-password
					global
					setting="wardriftPassword"
					placeholder="password"
				></sdpi-password>
			</sdpi-item>
			<sdpi-item label="">
				<sdpi-button id="test-wardrift">Test Wardrift</sdpi-button>
			</sdpi-item>

			<p id="test-status" style="margin: 8px 12px; font-size: 12px; opacity: 0.85"></p>
		</details>

		<details open>
			<summary>Auto-update (global)</summary>
			<p style="margin: 4px 12px 8px; font-size: 12px; opacity: 0.85">
				WDGWars and Wardrift refresh every 4 hours. WiGLE refreshes once per day at the time below.
			</p>
			<sdpi-item label="WiGLE daily time">
				<sdpi-calendar
					global
					type="time"
					setting="wigleDailyTime"
					default="06:00"
				></sdpi-calendar>
			</sdpi-item>
			<sdpi-item label="WiGLE timezone">
				<sdpi-select global setting="wigleTimezone" default="local">
					<option value="local">Local (host clock)</option>
					<option value="UTC">UTC</option>
					<option value="America/Los_Angeles">America/Los_Angeles</option>
					<option value="America/Denver">America/Denver</option>
					<option value="America/Chicago">America/Chicago</option>
					<option value="America/New_York">America/New_York</option>
					<option value="Europe/London">Europe/London</option>
					<option value="Europe/Berlin">Europe/Berlin</option>
					<option value="Europe/Warsaw">Europe/Warsaw</option>
					<option value="Asia/Tokyo">Asia/Tokyo</option>
					<option value="Australia/Sydney">Australia/Sydney</option>
				</sdpi-select>
			</sdpi-item>
		</details>

		<script>
			const { streamDeckClient } = SDPIComponents;
			const statusEl = document.getElementById("test-status");
			const platformSelect = document.getElementById("platform");
			const metricItems = {
				wigle: document.getElementById("metric-wigle"),
				wdgwars: document.getElementById("metric-wdgwars"),
				wardrift: document.getElementById("metric-wardrift")
			};

			/** Show only the Metric dropdown for the selected platform. */
			function syncMetricVisibility(platform) {
				const selected = metricItems[platform] ? platform : "wigle";
				for (const [key, el] of Object.entries(metricItems)) {
					if (!el) {
						continue;
					}
					// Inline display — sdpi-item host styles ignore the HTML hidden attribute.
					el.style.display = key === selected ? "" : "none";
				}
			}

			platformSelect.addEventListener("valuechange", (ev) => {
				syncMetricVisibility(ev.target.value);
			});
			// Initial paint before valuechange (defaults / delayed settings sync).
			syncMetricVisibility(platformSelect.value || "wigle");

			function setStatus(ok, message) {
				statusEl.textContent = message;
				statusEl.style.color = ok ? "#6f6" : "#f66";
			}

			streamDeckClient.sendToPropertyInspector.subscribe((ev) => {
				const payload = ev?.payload ?? ev;
				if (payload?.event === "testConnectionResult") {
					setStatus(Boolean(payload.ok), payload.message ?? "");
				}
			});

			document.getElementById("test-wigle").addEventListener("click", () => {
				setStatus(true, "Testing WiGLE…");
				streamDeckClient.send("sendToPlugin", {
					event: "testConnection",
					platform: "wigle"
				});
			});

			document.getElementById("test-wdgwars").addEventListener("click", () => {
				setStatus(true, "Testing WDGWars…");
				streamDeckClient.send("sendToPlugin", {
					event: "testConnection",
					platform: "wdgwars"
				});
			});

			document.getElementById("test-wardrift").addEventListener("click", () => {
				setStatus(true, "Testing Wardrift…");
				streamDeckClient.send("sendToPlugin", {
					event: "testConnection",
					platform: "wardrift"
				});
			});
		</script>
	</body>
</html>
